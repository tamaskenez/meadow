name: CI
run-name: CI (${{ inputs.build_type || 'Debug' }})

on:
  push:
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        description: 'Build type'
        default: Debug
        options:
          - Debug
          - Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-26
            cmake_generator: -G Xcode
          - os: windows-2025
            cmake_generator: ""
          - os: ubuntu-26.04
            cmake_generator: ""
            # GCC 15 (the default) lacks <mdspan>.
            gcc_version: 16

    env:
      BUILD_TYPE: ${{ inputs.build_type || 'Debug' }}

    steps:
      - uses: actions/checkout@v6

      - name: Install GCC ${{ matrix.gcc_version }}
        if: matrix.gcc_version
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-${{ matrix.gcc_version }}
          echo "CC=gcc-${{ matrix.gcc_version }}" >> "$GITHUB_ENV"
          echo "CXX=g++-${{ matrix.gcc_version }}" >> "$GITHUB_ENV"
          g++-${{ matrix.gcc_version }} --version

      - name: Cache Conan packages
        id: conan-cache
        uses: actions/cache@v5
        with:
          path: id
          key: conan-${{ matrix.os }}${{ matrix.gcc_version && format('-gcc{0}', matrix.gcc_version) || '' }}-${{ hashFiles('conanfile.txt', '1_build_conan.sh', 'conan/**') }}

      - name: Install Conan
        if: steps.conan-cache.outputs.cache-hit != 'true'
        uses: conan-io/setup-conan@v1

      - name: Build Conan dependencies
        if: steps.conan-cache.outputs.cache-hit != 'true'
        shell: bash
        run: ./1_build_conan.sh --use-deployer

      - name: Configure
        run: cmake -S . -B _b ${{ matrix.cmake_generator }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build _b --config ${{ env.BUILD_TYPE }}

      - name: Test
        run: ctest --test-dir _b -C ${{ env.BUILD_TYPE }} --output-on-failure
